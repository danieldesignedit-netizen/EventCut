name: Build EventCut Engine

on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check the folder layout and read the version
        id: ver
        shell: pwsh
        run: |
          if (Test-Path engine/engine) {
            Write-Error "There is an 'engine' folder inside the 'engine' folder (engine/engine). Delete engine/engine on GitHub, then upload the engine folder from the top level of the repository, so the files land in engine/eventcut, engine/build and so on."
            exit 1
          }
          $m = Select-String -Path engine/eventcut/config.py -Pattern 'VERSION = "([^"]+)"'
          if (-not $m) { Write-Error "engine/eventcut/config.py has no VERSION line."; exit 1 }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building EventCut Engine $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg (with NVIDIA support)
        working-directory: engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z -OutFile ffmpeg.7z
          7z e ffmpeg.7z -obin ffmpeg.exe ffprobe.exe -r -y
          Remove-Item ffmpeg.7z
          bin\ffmpeg.exe -hide_banner -encoders | Select-String nvenc

      - name: Download speech-to-text model
        working-directory: engine
        run: python -c "from faster_whisper import WhisperModel; WhisperModel('small', download_root='models/whisper')"

      - name: Build the app
        working-directory: engine
        shell: pwsh
        run: |
          "https://eventcut.netlify.app" | Out-File -Encoding ascii -NoNewline site.txt
          python build\make_ico.py
          pyinstaller --noconfirm --windowed --name "EventCut Engine" --icon eventcut.ico `
            --add-data "models;models" --add-data "fonts;fonts" --add-data "bin;bin" `
            --add-data "site.txt;." --add-data "eventcut.ico;." `
            --collect-all faster_whisper --collect-all ctranslate2 --hidden-import pystray._win32 app.py

      - name: Build the installer
        working-directory: engine
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\eventcut.iss
          Get-Item build\Output\EventCut-Engine-Setup-*.exe | Select-Object Name, Length

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          name: EventCut Engine ${{ steps.ver.outputs.version }}
          body: |
            Download **EventCut-Engine-Setup-${{ steps.ver.outputs.version }}.exe** below and run it. Windows may show "Windows protected your PC": click **More info**, then **Run anyway**.
          files: engine/build/Output/EventCut-Engine-Setup-*.exe
          make_latest: true
